[pytest]
bdd_features_base_dir = features/
testpaths = steps sql config
python_files = test_*.py
# The @self_healing scenarios use deliberately broken locators; run them on purpose with -m self_healing
addopts =
    -m "not self_healing"
    --html=reports/test-report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --tracing=retain-on-failure
    --output=reports/artifacts
    -p no:cacheprovider
    --tb=short
log_level = INFO
markers =
    ui: browser tests against the EMI web app
    api: JSONPlaceholder API tests
    app_api: API tests for the EMI Insights app's own backend
    sql: SQL scenario tests
    smoke: quick health checks
    positive: valid input is accepted
    negative: invalid input is rejected with a clear message, without crashing
    stress: large payload above the server's size limit
    self_healing: scenarios that use intentionally broken locators
    allow_http_errors: UI scenario that deliberately triggers server errors (skips the browser-errors check)
