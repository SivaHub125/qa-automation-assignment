<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EMI Calculator{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">EMI Insights</span>
    <nav aria-label="Main">
      <a href="/" {% if active == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="/report" {% if active == 'report' %}aria-current="page"{% endif %}>Report</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
